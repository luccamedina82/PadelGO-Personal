        }

        // Renderizar las preguntas en el DOM
        function renderQuiz() {
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.id = `card-${index}`;
                card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-200 transition-colors duration-300";
                
                // Título de la pregunta y tipo
                const questionHeader = document.createElement('div');
                questionHeader.className = "mb-4";
                
                const qTitle = document.createElement('h3');
                qTitle.className = "text-lg font-bold text-slate-800";
                qTitle.innerHTML = `<span class="text-blue-600 mr-2">${index + 1}.</span>${q.text}`;
                questionHeader.appendChild(qTitle);

                // Etiqueta indicadora de cuántas respuestas seleccionar
                if (q.type === 'multiple') {
                    const qHint = document.createElement('p');
                    qHint.className = "text-sm text-slate-500 mt-1 italic flex items-center";
                    qHint.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Selecciona todas las opciones correctas (pueden ser varias).`;
                    questionHeader.appendChild(qHint);
                } else {
                    const qHint = document.createElement('p');
                    qHint.className = "text-sm text-slate-500 mt-1 italic flex items-center";
                    qHint.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Selecciona una única opción correcta.`;
                    questionHeader.appendChild(qHint);
                }

                card.appendChild(questionHeader);

                // Opciones
                const optionsContainer = document.createElement('div');
                optionsContainer.className = "space-y-3 mt-4";

                q.options.forEach((opt, optIndex) => {
                    const label = document.createElement('label');
                    label.className = "flex items-center p-4 w-full rounded-xl bg-slate-50 border border-slate-200 cursor-pointer touch-manipulation active:bg-blue-50 md:hover:bg-slate-100 transition-colors";
                    
                    const input = document.createElement('input');
                    input.type = q.type === 'multiple' ? 'checkbox' : 'radio';
                    input.name = `q${index}`;
                    input.value = optIndex;
                    input.className = q.type === 'multiple' 
                        ? "h-6 w-6 flex-shrink-0 text-blue-600 rounded border-slate-300 focus:ring-blue-500" 
                        : "h-6 w-6 flex-shrink-0 text-blue-600 border-slate-300 focus:ring-blue-500";
                    
                    const span = document.createElement('span');
                    span.className = "ml-3 md:ml-4 text-slate-700 font-medium text-base leading-snug";
                    span.innerText = opt;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsContainer.appendChild(label);
                });

                card.appendChild(optionsContainer);

                // Contenedor de Feedback (se muestra al enviar)
                const feedbackDiv = document.createElement('div');
                feedbackDiv.id = `feedback-${index}`;
                feedbackDiv.className = "hidden mt-6 p-4 rounded-xl text-sm fade-in";
                card.appendChild(feedbackDiv);

                container.appendChild(card);
            });
        }

        // Evaluar el Quiz
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            let totalCorrect = 0;
            let totalIncorrect = 0;

            questions.forEach((q, index) => {
                const inputs = document.querySelectorAll(`input[name="q${index}"]`);
                let selected = [];
                
                inputs.forEach((input) => {
                    if (input.checked) {
                        selected.push(parseInt(input.value));
                    }
                    // Deshabilitar inputs después de enviar
                    input.disabled = true;
                });

                // Ordenar para comparar arrays sin importar el orden de selección
                selected.sort((a,b) => a-b);
                const qCorrectSorted = [...q.correct].sort((a,b) => a-b);
                
                // Verificar si la respuesta es exactamente igual a las correctas (ni una más, ni una menos)
                const isCorrect = JSON.stringify(selected) === JSON.stringify(qCorrectSorted);

                const card = document.getElementById(`card-${index}`);
                const feedback = document.getElementById(`feedback-${index}`);

                // Construir lista de respuestas correctas en texto para mostrar
                const correctTexts = q.correct.map(i => `<li class="mb-1">${q.options[i]}</li>`).join("");

                if (isCorrect) {
                    totalCorrect++;
                    // Estilos de acierto
                    card.classList.remove('border-slate-200');
                    card.classList.add('border-green-400', 'bg-green-50/30');
                    
                    feedback.classList.remove('hidden');
                    feedback.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-200');
                    feedback.innerHTML = `
                        <div class="flex items-center font-bold text-base mb-2">
                            <svg class="w-5 h-5 mr-2 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                            ¡Respuesta Correcta!
                        </div>
                        <p class="font-semibold mb-1">Las respuestas eran:</p>
                        <ul class="list-disc list-inside ml-2">${correctTexts}</ul>
                    `;
                } else {
                    totalIncorrect++;
                    // Estilos de error
                    card.classList.remove('border-slate-200');
                    card.classList.add('border-red-400', 'bg-red-50/30');
                    
                    feedback.classList.remove('hidden');
                    feedback.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-200');
                    feedback.innerHTML = `
                        <div class="flex items-center font-bold text-base mb-2">
                            <svg class="w-5 h-5 mr-2 text-red-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>
                            Respuesta Incorrecta (o incompleta)
                        </div>
                        <p class="font-semibold mb-1">Las respuestas correctas son:</p>
                        <ul class="list-disc list-inside ml-2">${correctTexts}</ul>
                    `;
                }
            });

            // Actualizar Tarjeta de Resumen
            document.getElementById('correctCount').innerText = totalCorrect;
            document.getElementById('incorrectCount').innerText = totalIncorrect;
            
            const score = (totalCorrect / questions.length) * 100;
            document.getElementById('scorePercentage').innerText = `${score.toFixed(0)}%`;

            // Ocultar botón de enviar y mostrar resumen
            document.getElementById('submitBtn').classList.add('hidden');
            const summaryCard = document.getElementById('summaryCard');
            summaryCard.classList.remove('hidden');
            
            // Hacer scroll suave hacia arriba para ver el resultado
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Iniciar la carga
        renderQuiz();
    </script>
</body>
</html>
